<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyList</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#FAF9F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyList">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 192 192%22%3E%3Crect width=%22192%22 height=%22192%22 rx=%2228%22 fill=%22%233F5A44%22/%3E%3Ctext x=%2296%22 y=%22132%22 font-family=%22-apple-system, sans-serif%22 font-size=%22120%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%23FFFFFF%22%3EM%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --spazio-safe-top: env(safe-area-inset-top, 0px);
    --spazio-safe-bottom: env(safe-area-inset-bottom, 0px);
    --spazio-safe-left: env(safe-area-inset-left, 0px);
    --spazio-safe-right: env(safe-area-inset-right, 0px);
    --colore-sfondo: #FAF9F5;
    --colore-testo: #262624;
    --colore-attenuato: #7A776F;
    --colore-nota: #827F77;
    --colore-accento: #2f6fed;
    --colore-pericolo: #d64545;
    --colore-bordo: #E8E6DF;
    --colore-superficie: #ffffff;
    --colore-intestazione-sezione-sfondo: #DDE7DC;
    --colore-intestazione-sezione-testo: #3F5A44;
    --colore-barra-traccia: #E5E3DB;
    --colore-barra-riempimento: #3F5A44;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow-x: hidden;
  }

  body {
    background: var(--colore-sfondo);
    color: var(--colore-testo);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
  }

  .schermata {
    position: relative;
    min-height: 100vh;
    max-width: 420px;
    margin: 0 auto;
    padding-top: calc(var(--spazio-safe-top) + 16px);
    padding-bottom: calc(var(--spazio-safe-bottom) + 10px);
    padding-left: calc(var(--spazio-safe-left) + 10px);
    padding-right: calc(var(--spazio-safe-right) + 10px);
    background-color: var(--colore-sfondo);
  }

  .nascosta {
    display: none !important;
  }

  .intestazione {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }

  .intestazione h1 {
    font-size: 20px;
    margin: 0;
  }

  .pulsante {
    min-height: 44px;
    min-width: 44px;
    padding: 0 16px;
    border: none;
    border-radius: 10px;
    background: var(--colore-accento);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }

  .pulsante-icona {
    min-height: 44px;
    min-width: 44px;
    border: none;
    border-radius: 10px;
    background: var(--colore-accento);
    color: #fff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }

  .pulsante-secondario {
    background: var(--colore-superficie);
    color: var(--colore-testo);
    border: 1px solid var(--colore-bordo);
  }

  .azioni-intestazione {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pulsante-icona-piccolo {
    min-height: 40px;
    min-width: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--colore-bordo);
    border-radius: 8px;
    background: var(--colore-superficie);
    color: var(--colore-testo);
    cursor: pointer;
  }

  .pulsante-elimina-discreto {
    min-height: 44px;
    min-width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: var(--colore-attenuato);
    cursor: pointer;
  }

  .banner-messaggio {
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    background: #fde2e2;
    color: #7a1f1f;
    border: 1px solid #f3b4b4;
  }

  .banner-messaggio.successo {
    background: #e1f5e1;
    color: #1f5c1f;
    border-color: #b7dfb7;
  }

  .contenitore-ricerca {
    position: relative;
    margin-bottom: 16px;
  }

  .contenitore-ricerca .icona-lente {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--colore-attenuato);
    pointer-events: none;
  }

  .campo-ricerca {
    width: 100%;
    height: 44px;
    padding: 0 12px 0 34px;
    font-size: 16px;
    font-family: inherit;
    border: none;
    border-radius: 8px;
    background: var(--colore-superficie);
  }

  .elenco-liste {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .riga-lista {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 40px;
    padding: 8px 10px;
    background: var(--colore-superficie);
    border: 1px solid var(--colore-bordo);
    border-radius: 12px;
    cursor: pointer;
  }

  .riga-lista .titolo-riga {
    font-size: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .riga-lista .contatore-riga {
    flex-shrink: 0;
    color: var(--colore-attenuato);
    font-size: 14px;
  }

  .vuoto {
    color: var(--colore-attenuato);
    text-align: center;
    margin-top: 40px;
  }

  .intestazione-titolo {
    display: flex;
    flex-direction: column;
    margin-bottom: 10px;
  }

  .sottotitolo-data {
    margin: 2px 0 0 8px;
    color: var(--colore-attenuato);
    font-size: 14px;
  }

  .campo-titolo {
    flex: 1;
    min-width: 0;
    min-height: 40px;
    font-size: 18px;
    font-weight: bold;
    font-family: inherit;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 6px 8px;
    background: transparent;
  }

  .campo-titolo:focus {
    border-color: var(--colore-bordo);
    background: var(--colore-superficie);
  }

  .riepilogo-avanzamento {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    color: var(--colore-attenuato);
    margin-bottom: 6px;
  }

  .barra-avanzamento {
    height: 6px;
    border-radius: 3px;
    background: var(--colore-barra-traccia);
    overflow: hidden;
    margin-bottom: 16px;
  }

  .barra-avanzamento-riempimento {
    height: 100%;
    background: var(--colore-barra-riempimento);
  }

  .elenco-voci {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 12px;
  }

  .sezione {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--colore-bordo);
    border-radius: 12px;
    overflow: hidden;
    background: var(--colore-superficie);
  }

  .intestazione-sezione {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    font-weight: bold;
    background: var(--colore-intestazione-sezione-sfondo);
    color: var(--colore-intestazione-sezione-testo);
  }

  .sezione-voci {
    display: flex;
    flex-direction: column;
  }

  .riga-voce {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 6px 10px;
    background: var(--colore-superficie);
    border-top: 1px solid var(--colore-bordo);
  }

  .sezione-voci .riga-voce:first-child {
    border-top: none;
  }

  .riga-voce input[type="checkbox"] {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
  }

  .riga-voce .contenuto-voce {
    flex: 1;
    min-width: 0;
  }

  .riga-voce .testo-voce {
    display: block;
    font-size: 16px;
    font-weight: 500;
    word-break: break-word;
  }

  .riga-voce .nota-voce {
    display: block;
    font-size: 13px;
    color: var(--colore-nota);
    word-break: break-word;
    margin-top: 2px;
  }

  .riga-voce.fatta .testo-voce {
    text-decoration: line-through;
    color: var(--colore-attenuato);
  }

  .riga-voce.fatta .nota-voce {
    text-decoration: line-through;
  }

  .campo-modifica-titolo,
  .campo-modifica-nota {
    display: block;
    width: 100%;
    font-family: inherit;
    border: 1px solid var(--colore-bordo);
    border-radius: 8px;
    background: var(--colore-superficie);
    padding: 4px 6px;
  }

  .campo-modifica-titolo {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 4px;
  }

  .campo-modifica-nota {
    font-size: 16px;
    font-weight: 400;
    color: var(--colore-nota);
    min-height: 32px;
    resize: vertical;
  }

  .riga-voce .elimina-voce {
    flex-shrink: 0;
    min-height: 40px;
    min-width: 36px;
    border: none;
    background: transparent;
    color: var(--colore-pericolo);
    font-size: 18px;
    cursor: pointer;
  }

  .maniglia-trascina {
    display: flex;
    flex-shrink: 0;
    min-height: 40px;
    min-width: 32px;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--colore-attenuato);
    touch-action: none;
    user-select: none;
    cursor: grab;
  }

  .riga-voce {
    transition: transform 150ms ease, box-shadow 150ms ease;
  }

  .riga-voce.in-trascinamento {
    opacity: 0.9;
    position: relative;
    z-index: 5;
  }

  .riga-voce.in-trascinamento .maniglia-trascina {
    cursor: grabbing;
  }

  .barra-nuova-voce {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 10px;
    margin-bottom: 16px;
    border: 1px solid var(--colore-bordo);
    border-radius: 10px;
    background: var(--colore-superficie);
  }

  .campo-nuova-voce {
    min-height: 40px;
    padding: 4px 2px;
    font-size: 16px;
    font-family: inherit;
    border: none;
    background: transparent;
  }

  .campo-nuova-nota {
    display: block;
    width: 100%;
    min-height: 32px;
    padding: 4px 2px;
    font-size: 16px;
    font-family: inherit;
    color: var(--colore-nota);
    border: none;
    background: transparent;
    resize: vertical;
  }

</style>
</head>
<body>

<div id="schermata-elenco" class="schermata">
  <div class="intestazione">
    <h1>MyList</h1>
    <div class="azioni-intestazione">
      <button id="pulsante-esporta" class="pulsante-icona-piccolo" title="Esporta backup">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 4v10m0 0-4-4m4 4 4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <button id="pulsante-importa" class="pulsante-icona-piccolo" title="Importa backup">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 20V10m0 0-4 4m4-4 4 4M5 5h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <button id="pulsante-nuova-lista" class="pulsante-icona" title="Nuova lista">+</button>
    </div>
  </div>
  <input id="input-importa-file" type="file" accept="application/json" class="nascosta">
  <div id="banner-messaggio" class="banner-messaggio nascosta"></div>
  <div class="contenitore-ricerca">
    <svg class="icona-lente" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
      <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
      <line x1="15.3" y1="15.3" x2="21" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line>
    </svg>
    <input id="campo-ricerca" class="campo-ricerca" type="text" placeholder="Cerca nelle note">
  </div>
  <div id="elenco-liste" class="elenco-liste"></div>
</div>

<div id="schermata-dettaglio" class="schermata nascosta">
  <div class="intestazione">
    <button id="pulsante-torna-elenco" class="pulsante-secondario pulsante">&larr; Liste</button>
    <button id="pulsante-elimina-lista" class="pulsante-elimina-discreto" title="Elimina lista">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
  </div>
  <div class="intestazione-titolo">
    <input id="campo-titolo" class="campo-titolo" type="text">
    <p id="sottotitolo-data" class="sottotitolo-data"></p>
  </div>
  <div class="riepilogo-avanzamento">
    <span>completate</span>
    <span id="contatore-avanzamento"></span>
  </div>
  <div class="barra-avanzamento"><div id="barra-avanzamento-riempimento" class="barra-avanzamento-riempimento"></div></div>
  <div id="elenco-voci" class="elenco-voci"></div>
  <form id="form-nuova-voce" class="barra-nuova-voce">
    <input id="campo-nuova-voce" class="campo-nuova-voce" type="text" placeholder="Nuova voce" enterkeyhint="done">
    <textarea id="campo-nuova-nota" class="campo-nuova-nota" placeholder="Nota (facoltativa)" rows="1" enterkeyhint="done"></textarea>
  </form>
</div>

<script>

  let liste = [];
  let listaApertaId = null;
  let testoRicerca = "";
  let dbPromise = null;
  let voceInModificaId = null;

  function apriDatabase() {
    return new Promise((risolvi, rifiuta) => {
      const richiesta = indexedDB.open("mylist", 1);
      richiesta.onupgradeneeded = () => {
        const db = richiesta.result;
        if (!db.objectStoreNames.contains("liste")) {
          const store = db.createObjectStore("liste", { keyPath: "id" });
          store.createIndex("per_data", "data");
        }
      };
      richiesta.onsuccess = () => risolvi(richiesta.result);
      richiesta.onerror = () => rifiuta(richiesta.error);
    });
  }

  function ottieniDatabase() {
    if (!dbPromise) dbPromise = apriDatabase();
    return dbPromise;
  }

  async function ottieniTutteLeListeDalDB() {
    const db = await ottieniDatabase();
    return new Promise((risolvi, rifiuta) => {
      const richiesta = db.transaction("liste", "readonly").objectStore("liste").getAll();
      richiesta.onsuccess = () => risolvi(richiesta.result);
      richiesta.onerror = () => rifiuta(richiesta.error);
    });
  }

  async function salvaListaNelDB(lista) {
    const db = await ottieniDatabase();
    return new Promise((risolvi, rifiuta) => {
      const transazione = db.transaction("liste", "readwrite");
      transazione.objectStore("liste").put(lista);
      transazione.oncomplete = () => risolvi();
      transazione.onerror = () => rifiuta(transazione.error);
    });
  }

  async function sostituisciArchivioNelDB(listeImportate) {
    const db = await ottieniDatabase();
    return new Promise((risolvi, rifiuta) => {
      const transazione = db.transaction("liste", "readwrite");
      const store = transazione.objectStore("liste");
      store.clear();
      listeImportate.forEach(lista => store.put(lista));
      transazione.oncomplete = () => risolvi();
      transazione.onerror = () => rifiuta(transazione.error);
    });
  }

  async function salva(lista) {
    try {
      await salvaListaNelDB(lista);
    } catch (errore) {
      mostraMessaggio("Salvataggio non riuscito: la lista resta visibile ma potrebbe non essere conservata sul dispositivo.", "errore");
    }
  }

  function generaId() {
    return Date.now() + "-" + Math.random().toString(36).slice(2, 6);
  }

  function dataOggiISO() {
    const oggi = new Date();
    const anno = oggi.getFullYear();
    const mese = String(oggi.getMonth() + 1).padStart(2, "0");
    const giorno = String(oggi.getDate()).padStart(2, "0");
    return `${anno}-${mese}-${giorno}`;
  }

  function formattaTitoloData(dataISO) {
    const [anno, mese, giorno] = dataISO.split("-");
    const dataBreve = `${giorno}-${mese}-${anno}`;
    const data = new Date(`${dataISO}T00:00:00`);
    const giornoSettimana = data.toLocaleDateString('it-IT', { weekday: 'long' }).toLowerCase();
    return `${giornoSettimana} ${dataBreve}`;
  }

  function adessoISO() {
    return new Date().toISOString();
  }

  function formattaDataEstesa(dataISO) {
    const data = new Date(`${dataISO}T00:00:00`);
    return data.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  function ottieniTutteLeListeVisibili() {
    return liste
      .filter(lista => !lista.eliminata)
      .sort((a, b) => {
        if (a.data !== b.data) return b.data.localeCompare(a.data);
        return b.creata.localeCompare(a.creata);
      });
  }

  function ottieniListaPerId(id) {
    return liste.find(lista => lista.id === id);
  }

  async function creaNuovaLista() {
    const adesso = adessoISO();
    const dataOggi = dataOggiISO();
    const nuovaLista = {
      id: generaId(),
      data: dataOggi,
      titolo: formattaTitoloData(dataOggi),
      voci: [],
      creata: adesso,
      modificata: adesso,
      eliminata: false
    };
    liste.push(nuovaLista);
    await salva(nuovaLista);
    return nuovaLista;
  }

  async function aggiornaTitoloLista(id, nuovoTitolo) {
    const lista = ottieniListaPerId(id);
    lista.titolo = nuovoTitolo.trim() === "" ? formattaTitoloData(lista.data) : nuovoTitolo.trim();
    lista.modificata = adessoISO();
    await salva(lista);
  }

  async function aggiungiVoce(listaId, testo, nota) {
    const lista = ottieniListaPerId(listaId);
    const nuovaVoce = { id: generaId(), testo: testo.trim(), fatto: false };
    if (nota && nota.trim() !== "") {
      nuovaVoce.nota = nota.trim();
    }
    lista.voci.push(nuovaVoce);
    lista.modificata = adessoISO();
    await salva(lista);
  }

  function otteniNota(voce) {
    return voce.nota || "";
  }

  async function modificaVoce(listaId, voceId, nuovoTesto, nuovaNota) {
    const lista = ottieniListaPerId(listaId);
    const voce = lista.voci.find(v => v.id === voceId);
    voce.testo = nuovoTesto.trim();
    voce.nota = nuovaNota.trim();
    lista.modificata = adessoISO();
    await salva(lista);
  }

  async function toggleVoce(listaId, voceId) {
    const lista = ottieniListaPerId(listaId);
    const voce = lista.voci.find(v => v.id === voceId);
    voce.fatto = !voce.fatto;
    lista.modificata = adessoISO();
    await salva(lista);
  }

  async function eliminaVoce(listaId, voceId) {
    const lista = ottieniListaPerId(listaId);
    lista.voci = lista.voci.filter(v => v.id !== voceId);
    lista.modificata = adessoISO();
    await salva(lista);
  }


  async function riordinaVociSecondoId(listaId, ordineIdSezione) {
    const lista = ottieniListaPerId(listaId);
    const mappaVoci = new Map(lista.voci.map(voce => [voce.id, voce]));
    let indice = 0;
    lista.voci = lista.voci.map(voce => {
      if (!ordineIdSezione.includes(voce.id)) return voce;
      return mappaVoci.get(ordineIdSezione[indice++]);
    });
    lista.modificata = adessoISO();
    await salva(lista);
  }

  async function eliminaListaLogica(id) {
    const lista = ottieniListaPerId(id);
    lista.eliminata = true;
    lista.modificata = adessoISO();
    await salva(lista);
  }

  function calcolaContatore(lista) {
    const fatte = lista.voci.filter(v => v.fatto).length;
    return `${fatte}/${lista.voci.length}`;
  }

  function filtraListePerRicerca(elencoListe, testo) {
    const parole = testo.trim().toLowerCase().split(/\s+/).filter(parola => parola !== "");
    if (parole.length === 0) return elencoListe;
    return elencoListe.filter(lista => {
      const testoDellaLista = [lista.titolo, ...lista.voci.map(voce => voce.testo)]
        .join(" ")
        .toLowerCase();
      return parole.every(parola => testoDellaLista.includes(parola));
    });
  }

  function creaRigaLista(lista) {
    const riga = document.createElement("div");
    riga.className = "riga-lista";

    const titolo = document.createElement("span");
    titolo.className = "titolo-riga";
    titolo.textContent = lista.titolo;

    const contatore = document.createElement("span");
    contatore.className = "contatore-riga";
    contatore.textContent = calcolaContatore(lista);

    riga.appendChild(titolo);
    riga.appendChild(contatore);
    riga.addEventListener("click", () => gestisciAperturaLista(lista.id));

    return riga;
  }

  function creaRigaVoce(lista, voce) {
    if (voce.id === voceInModificaId) {
      return creaRigaVoceModifica(lista, voce);
    }

    const riga = document.createElement("div");
    riga.className = "riga-voce" + (voce.fatto ? " fatta" : "");
    riga.dataset.voceId = voce.id;

    const casella = document.createElement("input");
    casella.type = "checkbox";
    casella.checked = voce.fatto;
    casella.addEventListener("change", () => gestisciToggleVoce(lista.id, voce.id, voce.fatto, casella));

    const contenuto = document.createElement("div");
    contenuto.className = "contenuto-voce";
    contenuto.addEventListener("click", () => gestisciAperturaModificaVoce(voce.id));

    const testo = document.createElement("span");
    testo.className = "testo-voce";
    testo.textContent = voce.testo;
    contenuto.appendChild(testo);

    const nota = otteniNota(voce);
    if (nota !== "") {
      const rigaNota = document.createElement("span");
      rigaNota.className = "nota-voce";
      rigaNota.textContent = nota;
      contenuto.appendChild(rigaNota);
    }

    const maniglia = document.createElement("span");
    maniglia.className = "maniglia-trascina";
    maniglia.textContent = "⠿";
    maniglia.addEventListener("pointerdown", evento => iniziaTrascinamento(evento, riga, lista.id));

    const pulsanteElimina = document.createElement("button");
    pulsanteElimina.className = "elimina-voce";
    pulsanteElimina.textContent = "✕";
    pulsanteElimina.title = "Elimina voce";
    pulsanteElimina.addEventListener("click", () => gestisciEliminaVoce(lista.id, voce.id));

    riga.appendChild(casella);
    riga.appendChild(contenuto);
    riga.appendChild(maniglia);
    riga.appendChild(pulsanteElimina);

    return riga;
  }

  function creaSezioneVoci(lista, nome, voci) {
    const sezione = document.createElement("div");
    sezione.className = "sezione";

    const intestazione = document.createElement("div");
    intestazione.className = "intestazione-sezione";
    const etichetta = document.createElement("span");
    etichetta.textContent = nome;
    const conteggio = document.createElement("span");
    conteggio.textContent = voci.length;
    intestazione.appendChild(etichetta);
    intestazione.appendChild(conteggio);

    const contenitoreRighe = document.createElement("div");
    contenitoreRighe.className = "sezione-voci";
    voci.forEach(voce => contenitoreRighe.appendChild(creaRigaVoce(lista, voce)));

    sezione.appendChild(intestazione);
    sezione.appendChild(contenitoreRighe);
    return sezione;
  }

  function gestisciAperturaModificaVoce(voceId) {
    voceInModificaId = voceId;
    aggiornaVistaDettaglio();
  }

  function creaRigaVoceModifica(lista, voce) {
    const riga = document.createElement("div");
    riga.className = "riga-voce in-modifica" + (voce.fatto ? " fatta" : "");
    riga.dataset.voceId = voce.id;

    const casella = document.createElement("input");
    casella.type = "checkbox";
    casella.checked = voce.fatto;
    casella.addEventListener("change", () => gestisciToggleVoce(lista.id, voce.id, voce.fatto, casella));

    const contenuto = document.createElement("div");
    contenuto.className = "contenuto-voce";

    const campoTitolo = document.createElement("input");
    campoTitolo.type = "text";
    campoTitolo.className = "campo-modifica-titolo";
    campoTitolo.value = voce.testo;

    const campoNota = document.createElement("textarea");
    campoNota.className = "campo-modifica-nota";
    campoNota.value = otteniNota(voce);
    campoNota.rows = 1;
    campoNota.placeholder = "Nota (facoltativa)";

    contenuto.appendChild(campoTitolo);
    contenuto.appendChild(campoNota);

    riga.appendChild(casella);
    riga.appendChild(contenuto);

    const chiudiESalva = async () => {
      if (voceInModificaId !== voce.id) return;
      voceInModificaId = null;
      if (campoTitolo.value.trim() === "") {
        aggiornaVistaDettaglio();
        return;
      }
      await modificaVoce(lista.id, voce.id, campoTitolo.value, campoNota.value);
      aggiornaVistaDettaglio();
    };

    riga.addEventListener("focusout", evento => {
      if (riga.contains(evento.relatedTarget)) return;
      chiudiESalva();
    });

    campoTitolo.addEventListener("keydown", evento => {
      if (evento.key === "Enter") {
        evento.preventDefault();
        campoNota.focus();
      }
    });

    requestAnimationFrame(() => campoTitolo.focus());

    return riga;
  }

  function mostraSchermata(nome) {
    document.getElementById("schermata-elenco").classList.toggle("nascosta", nome !== "elenco");
    document.getElementById("schermata-dettaglio").classList.toggle("nascosta", nome !== "dettaglio");
  }

  function aggiornaVistaElenco() {
    const contenitore = document.getElementById("elenco-liste");
    contenitore.innerHTML = "";

    const listeVisibili = filtraListePerRicerca(ottieniTutteLeListeVisibili(), testoRicerca);

    if (listeVisibili.length === 0) {
      const messaggioVuoto = document.createElement("p");
      messaggioVuoto.className = "vuoto";
      messaggioVuoto.textContent = "Nessuna lista trovata";
      contenitore.appendChild(messaggioVuoto);
      return;
    }

    listeVisibili.forEach(lista => {
      contenitore.appendChild(creaRigaLista(lista));
    });
  }

  function aggiornaVistaDettaglio() {
    const lista = ottieniListaPerId(listaApertaId);

    const campoTitolo = document.getElementById("campo-titolo");
    campoTitolo.value = lista.titolo;

    document.getElementById("sottotitolo-data").textContent = formattaDataEstesa(lista.data);

    const fatte = lista.voci.filter(v => v.fatto).length;
    const totale = lista.voci.length;
    document.getElementById("contatore-avanzamento").textContent = `${fatte} / ${totale}`;
    const percentuale = totale === 0 ? 0 : (fatte / totale) * 100;
    document.getElementById("barra-avanzamento-riempimento").style.width = `${percentuale}%`;

    const contenitoreVoci = document.getElementById("elenco-voci");
    contenitoreVoci.innerHTML = "";
    const daFare = lista.voci.filter(voce => !voce.fatto);
    const eseguiti = lista.voci.filter(voce => voce.fatto);
    if (daFare.length > 0) {
      contenitoreVoci.appendChild(creaSezioneVoci(lista, "Task da effettuare", daFare));
    }
    if (eseguiti.length > 0) {
      contenitoreVoci.appendChild(creaSezioneVoci(lista, "Task già eseguiti", eseguiti));
    }

    document.getElementById("campo-nuova-voce").value = "";
    document.getElementById("campo-nuova-nota").value = "";
  }

  async function gestisciNuovaLista() {
    const nuovaLista = await creaNuovaLista();
    listaApertaId = nuovaLista.id;
    voceInModificaId = null;
    aggiornaVistaDettaglio();
    mostraSchermata("dettaglio");
  }

  function gestisciAperturaLista(id) {
    listaApertaId = id;
    voceInModificaId = null;
    aggiornaVistaDettaglio();
    mostraSchermata("dettaglio");
  }

  function gestisciRitornoElenco() {
    listaApertaId = null;
    voceInModificaId = null;
    aggiornaVistaElenco();
    mostraSchermata("elenco");
  }

  async function gestisciModificaTitolo(evento) {
    await aggiornaTitoloLista(listaApertaId, evento.target.value);
    aggiornaVistaDettaglio();
  }

  async function gestisciToggleVoce(listaId, voceId, eraFatta, casella) {
    if (eraFatta) {
      const conferma = confirm("Vuoi veramente riattivare questo punto?");
      if (!conferma) {
        casella.checked = true;
        return;
      }
    }
    await toggleVoce(listaId, voceId);
    aggiornaVistaDettaglio();
  }

  async function gestisciEliminaVoce(listaId, voceId) {
    await eliminaVoce(listaId, voceId);
    aggiornaVistaDettaglio();
  }


  let elementoTrascinato = null;
  let listaIdTrascinata = null;
  let yPuntatoreIniziale = 0;

  function iniziaTrascinamento(evento, riga, listaId) {
    elementoTrascinato = riga;
    listaIdTrascinata = listaId;
    yPuntatoreIniziale = evento.clientY;
    riga.classList.add("in-trascinamento");
    document.addEventListener("pointermove", spostaDuranteTrascinamento);
    document.addEventListener("pointerup", terminaTrascinamento);
    document.addEventListener("pointercancel", terminaTrascinamento);
  }

  function catturaPosizioniVerticali(contenitore) {
    const posizioni = new Map();
    Array.from(contenitore.children).forEach(elemento => {
      posizioni.set(elemento, elemento.getBoundingClientRect().top);
    });
    return posizioni;
  }

  function animaSpostamentoSiblings(contenitore, posizioniPrima) {
    Array.from(contenitore.children).forEach(elemento => {
      if (elemento === elementoTrascinato) return;
      const primaTop = posizioniPrima.get(elemento);
      const dopoTop = elemento.getBoundingClientRect().top;
      const delta = primaTop - dopoTop;
      if (!delta) return;

      elemento.style.transition = "none";
      elemento.style.transform = `translateY(${delta}px)`;
      requestAnimationFrame(() => {
        elemento.style.transition = "";
        elemento.style.transform = "";
      });
    });
  }

  function trovaVicinoDaScambiare(centroTrascinata) {
    const successivo = elementoTrascinato.nextElementSibling;
    if (successivo) {
      const rect = successivo.getBoundingClientRect();
      if (centroTrascinata > rect.top + rect.height / 2) {
        return { elemento: successivo, dopo: true };
      }
    }

    const precedente = elementoTrascinato.previousElementSibling;
    if (precedente) {
      const rect = precedente.getBoundingClientRect();
      if (centroTrascinata < rect.top + rect.height / 2) {
        return { elemento: precedente, dopo: false };
      }
    }

    return null;
  }

  function spostaDuranteTrascinamento(evento) {
    if (!elementoTrascinato) return;

    elementoTrascinato.style.transform = `translateY(${evento.clientY - yPuntatoreIniziale}px)`;

    const rettangoloTrascinata = elementoTrascinato.getBoundingClientRect();
    const centroTrascinata = rettangoloTrascinata.top + rettangoloTrascinata.height / 2;
    const vicino = trovaVicinoDaScambiare(centroTrascinata);
    if (!vicino) return;

    const contenitore = elementoTrascinato.parentElement;
    const posizioniPrima = catturaPosizioniVerticali(contenitore);
    const offsetTopPrima = elementoTrascinato.offsetTop;

    if (vicino.dopo) {
      contenitore.insertBefore(elementoTrascinato, vicino.elemento.nextSibling);
    } else {
      contenitore.insertBefore(elementoTrascinato, vicino.elemento);
    }

    yPuntatoreIniziale += elementoTrascinato.offsetTop - offsetTopPrima;
    elementoTrascinato.style.transform = `translateY(${evento.clientY - yPuntatoreIniziale}px)`;
    animaSpostamentoSiblings(contenitore, posizioniPrima);
  }

  function terminaTrascinamento() {
    if (!elementoTrascinato) return;

    elementoTrascinato.classList.remove("in-trascinamento");
    elementoTrascinato.style.transform = "";
    const contenitore = elementoTrascinato.parentElement;
    const nuovoOrdineIdSezione = Array.from(contenitore.children).map(elemento => elemento.dataset.voceId);
    riordinaVociSecondoId(listaIdTrascinata, nuovoOrdineIdSezione);

    elementoTrascinato = null;
    listaIdTrascinata = null;
    document.removeEventListener("pointermove", spostaDuranteTrascinamento);
    document.removeEventListener("pointerup", terminaTrascinamento);
    document.removeEventListener("pointercancel", terminaTrascinamento);
  }

  async function gestisciAggiuntaVoce(evento) {
    evento.preventDefault();
    const campo = document.getElementById("campo-nuova-voce");
    const campoNota = document.getElementById("campo-nuova-nota");
    const testo = campo.value;
    if (testo.trim() === "") return;
    await aggiungiVoce(listaApertaId, testo, campoNota.value);
    aggiornaVistaDettaglio();
    campo.focus();
  }

  async function gestisciEliminaLista() {
    const conferma = confirm("Eliminare l'intera lista?");
    if (!conferma) return;
    await eliminaListaLogica(listaApertaId);
    listaApertaId = null;
    aggiornaVistaElenco();
    mostraSchermata("elenco");
  }

  function gestisciRicerca(evento) {
    testoRicerca = evento.target.value;
    aggiornaVistaElenco();
  }

  function mostraMessaggio(testo, tipo) {
    const banner = document.getElementById("banner-messaggio");
    banner.textContent = testo;
    banner.className = "banner-messaggio" + (tipo === "successo" ? " successo" : "");
  }

  function esportaArchivio() {
    const contenuto = JSON.stringify(liste, null, 2);
    const blob = new Blob([contenuto], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `mylist-backup-${dataOggiISO()}.json`;
    link.click();
    URL.revokeObjectURL(url);
  }

  function gestisciEsportazione() {
    esportaArchivio();
    mostraMessaggio("Backup esportato.", "successo");
  }

  function leggiFileComeTesto(file) {
    return new Promise((risolvi, rifiuta) => {
      const lettore = new FileReader();
      lettore.onload = () => risolvi(lettore.result);
      lettore.onerror = () => rifiuta(lettore.error);
      lettore.readAsText(file);
    });
  }

  function èArchivioValido(dati) {
    return Array.isArray(dati) && dati.every(lista =>
      typeof lista.id === "string" && typeof lista.titolo === "string" && Array.isArray(lista.voci)
    );
  }

  async function gestisciImportazione(evento) {
    const file = evento.target.files[0];
    evento.target.value = "";
    if (!file) return;

    try {
      const testo = await leggiFileComeTesto(file);
      const dati = JSON.parse(testo);
      if (!èArchivioValido(dati)) {
        mostraMessaggio("Il file scelto non è un backup di MyList valido.", "errore");
        return;
      }

      const conferma = confirm("Importare questo file sostituirà tutte le liste presenti sul dispositivo. Continuare?");
      if (!conferma) return;

      await sostituisciArchivioNelDB(dati);
      liste = dati;
      listaApertaId = null;
      aggiornaVistaElenco();
      mostraSchermata("elenco");
      mostraMessaggio("Backup importato.", "successo");
    } catch (errore) {
      mostraMessaggio("Importazione non riuscita: il file potrebbe essere danneggiato.", "errore");
    }
  }

  document.getElementById("pulsante-nuova-lista").addEventListener("click", gestisciNuovaLista);
  document.getElementById("pulsante-torna-elenco").addEventListener("click", gestisciRitornoElenco);
  document.getElementById("campo-titolo").addEventListener("change", gestisciModificaTitolo);
  document.getElementById("form-nuova-voce").addEventListener("submit", gestisciAggiuntaVoce);
  document.getElementById("campo-nuova-nota").addEventListener("keydown", evento => {
    if (evento.key === "Enter" && !evento.shiftKey) {
      evento.preventDefault();
      document.getElementById("form-nuova-voce").requestSubmit();
    }
  });
  document.getElementById("pulsante-elimina-lista").addEventListener("click", gestisciEliminaLista);
  document.getElementById("campo-ricerca").addEventListener("input", gestisciRicerca);
  document.getElementById("pulsante-esporta").addEventListener("click", gestisciEsportazione);
  document.getElementById("pulsante-importa").addEventListener("click", () => document.getElementById("input-importa-file").click());
  document.getElementById("input-importa-file").addEventListener("change", gestisciImportazione);

  async function avviaApp() {
    try {
      liste = await ottieniTutteLeListeDalDB();
    } catch (errore) {
      liste = [];
      mostraMessaggio("Impossibile accedere al database locale: le liste create in questa sessione potrebbero non essere salvate.", "errore");
    }
    aggiornaVistaElenco();
    mostraSchermata("elenco");
  }

  avviaApp();

  function registraServiceWorker() {
    if (!("serviceWorker" in navigator)) return;
    navigator.serviceWorker.register("./sw.js");
  }

  window.addEventListener("load", registraServiceWorker);

</script>
